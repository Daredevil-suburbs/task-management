# ===========================
# Application Config
# ===========================
spring.application.name=task-management

# ===========================
# MySQL Database Config
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate Config
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# Server Config
# ===========================
server.port=8080

# ===========================
# JWT Config
# ===========================
# JWT secret should be set via environment variable: APP_JWT_SECRET
# Fallback to default for development only
app.jwt.secret=${APP_JWT_SECRET:mySecretKey123456789012345678901234567890123456789012345678901234}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
spring.main.allow-circular-references=true

# ===========================
# Swagger / OpenAPI Config
# ===========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
